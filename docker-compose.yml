# version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ragradar_qdrant
    ports:
      - "6333:6333" # HTTP REST API Port
      - "6334:6334" # High-speed gRPC API Port
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - ragradar_network
    restart: unless-stopped

  rag_app:
    
    build:
      context: .
      dockerfile: demo_target_app/Dockerfile
    container_name: ragradar_app
    ports:
      - "8000:8000"
    volumes:
      - .:/code
      - fastembed_cache_volume:/models/fastembed_cache #to share models across containers
    env_file:
      - .env
    environment:
      - ENV=development
      - LLM_MODEL_NAME=llama3-8b-8192
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_URL=http://qdrant:6333
      - PYTHONPATH=/code
      - DATABASE_URL=postgresql://admin:admin@postgres:5432/ragradar_telemetry
      - REDIS_URL=redis://redis:6379/0
      # - QDRANT_HOST=http://qdrant:6333
    networks:
      - ragradar_network
    depends_on:
      - qdrant
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: ragradar_postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=ragradar_telemetry
    ports:
      - "5432:5432"
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    networks:
      - ragradar_network
  
  redis:
    image: redis:7-alpine
    container_name: ragradar_redis
    ports:
      - "6379:6379"
    networks:
      - ragradar_network
  worker:
    build: 
      context: .
      dockerfile: demo_target_app/Dockerfile
    container_name: ragradar_worker
    command: celery -A app.services.celery_worker worker --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/code/demo_target_app
    volumes:
      - ./demo_target_app:/code/demo_target_app
    depends_on:
      - redis
    networks:
      - ragradar_network
  
  airflow:
    image: apache/airflow:2.9.1-python3.11
    container_name: ragradar_airflow
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth

    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
    command: standalone
    depends_on:
      - redis
    networks:
      - ragradar_network


volumes:
  qdrant_storage:
  fastembed_cache_volume:
  postgres_storage:

networks:
  ragradar_network:
    driver: bridge